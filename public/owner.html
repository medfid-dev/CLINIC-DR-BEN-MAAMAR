<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E2A6E">
<title>لوحة مالك التطبيق</title>
<link rel="icon" href="/icons/favicon-32.png">
<link rel="stylesheet" href="/owner.css">
</head>
<body>
<main>
  <section id="loginBox" class="box" hidden>
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1>لوحة مالك التطبيق</h1>
    <p class="muted">هذه الصفحة لمالك التطبيق فقط.</p>
    <form id="loginForm" autocomplete="on">
      <input type="password" id="pw" placeholder="كلمة مرور المالك" autocomplete="current-password" required>
      <button type="submit" class="btn primary">دخول</button>
    </form>
    <div id="loginErr" class="err" role="alert"></div>
  </section>

  <section id="panel" hidden>
    <header class="top">
      <div><h1>لوحة مالك التطبيق</h1><div class="muted" id="updated"></div></div>
      <button type="button" class="btn" id="logoutBtn">خروج</button>
    </header>

    <div class="stats" id="stats"></div>

    <label class="switch-row">
      <span><strong>اشتراط موافقتي على الحسابات الجديدة</strong><br><small class="muted">عند التفعيل يبقى كل حساب جديد «بانتظار الموافقة» ولا يستطيع الدخول حتى تقبله.</small></span>
      <input type="checkbox" id="approvalToggle">
    </label>

    <div class="tools">
      <input type="search" id="q" placeholder="بحث: اسم العيادة أو الطبيب أو اسم المستخدم أو الرمز">
      <div class="tabs" id="tabs">
        <button type="button" data-f="all" class="on">الكل</button>
        <button type="button" data-f="pending">بانتظار الموافقة</button>
        <button type="button" data-f="active">فعّالة</button>
        <button type="button" data-f="suspended">موقوفة</button>
      </div>
    </div>

    <div id="list" class="list"></div>
  </section>
  <div id="toast" class="toast" role="status"></div>
</main>
<script src="/sounds.js"></script>
<script src="/owner.js"></script>
</body>
</html>
